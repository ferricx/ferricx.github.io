<section
  class="carousel"
  aria-roledescription="carousel"
  aria-label="Page patterns"
>
  <div class="carousel-controls">
    <button
      type="button"
      class="carousel-btn carousel-btn--prev"
      aria-label="Previous slide"
      (click)="prev()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>

    <div
      #trackWrapper
      class="carousel-track-wrapper"
    >
      <ul class="carousel-track">
        @for (slide of slides; track slide.route; let i = $index) {
          <li
            [id]="'carousel-panel-' + (i + 1)"
            class="carousel-slide"
            aria-roledescription="slide"
            [attr.aria-label]="slide.heading"
            [attr.aria-posinset]="i + 1"
            [attr.aria-setsize]="total"
          >
            <div class="slide-content" [attr.inert]="currentIndex() !== i ? '' : null">
              <h3
                #headingEl
                class="slide-heading"
                tabindex="-1"
              >{{ slide.heading }}</h3>
              <p class="slide-description">{{ slide.description }}</p>
              <a
                [routerLink]="slide.route"
                class="slide-link"
                tabindex="0"
              >{{ slide.linkLabel }}</a>
            </div>
          </li>
        }
      </ul>
    </div>

    <button
      type="button"
      class="carousel-btn carousel-btn--next"
      aria-label="Next slide"
      (click)="next()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
  </div>

  <div role="tablist" class="carousel-indicators" aria-label="Choose slide">
    @for (slide of slides; track slide.route; let i = $index) {
      <button
        #dotEl
        [id]="'carousel-tab-' + (i + 1)"
        type="button"
        role="tab"
        class="carousel-dot"
        [class.active]="currentIndex() === i"
        [attr.aria-selected]="currentIndex() === i ? 'true' : 'false'"
        [attr.aria-label]="slide.heading"
        [tabindex]="currentIndex() === i ? 0 : -1"
        (click)="goTo(i)"
        (keydown)="onDotKeydown($event, i)"
      ></button>
    }
  </div>

</section>
