
<h1 tabindex="-1" #pageHeading>Profile</h1>

<section class="password-section" aria-labelledby="password-heading">
  <h2 id="password-heading">Change Password</h2>
  <form id="password-form" novalidate (submit)="onPasswordSubmit($event)">
    <app-error-summary formId="password-form"></app-error-summary>
    <app-form-group
      #currentPwGroup
      field-id="current-password"
      name="currentPassword"
      label="Current password"
      type="password"
      autocomplete="current-password"
      [required]="true"
      [show-hide-toggle]="true"
    ></app-form-group>
    <app-form-group
      #newPwGroup
      field-id="new-password"
      name="newPassword"
      label="New password"
      type="password"
      autocomplete="new-password"
      pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
      format-message="Password must be at least 8 characters and include uppercase, lowercase, a number, and a special character."
      [required]="true"
      [show-hide-toggle]="true"
      (valueChange)="newPasswordValue.set($event)"
    ></app-form-group>
    <ul class="password-rules" aria-label="Password requirements">
      @for (rule of passwordRules(); track rule.label) {
        <li [class.met]="rule.met" [attr.aria-label]="rule.label + (rule.met ? ', met' : ', not met')">
          <span class="rule-icon" aria-hidden="true">{{ rule.met ? '✓' : '○' }}</span>
          {{ rule.label }}
        </li>
      }
    </ul>
    <app-form-group
      #confirmPwGroup
      field-id="confirm-password"
      name="confirmPassword"
      label="Confirm new password"
      type="password"
      autocomplete="new-password"
      [required]="true"
      [show-hide-toggle]="true"
    ></app-form-group>
    <div class="password-actions">
      <button type="submit" class="btn-primary">Update password</button>
    </div>
    @if (passwordSuccess()) {
      <p class="password-success" role="status">Password updated successfully.</p>
    }
  </form>
</section>

<section class="theme-section" aria-labelledby="theme-heading">
  <h2 id="theme-heading">Theme</h2>
  <p>Pick a color to generate a site-wide theme.</p>
  <div class="theme-controls">
    <label for="theme-color">Theme color</label>
    <input
      id="theme-color"
      type="color"
      [value]="sourceColor"
      (input)="onColorChange($event)"
    />
    <span class="color-hex">{{ sourceColor }}</span>
  </div>
  <div class="theme-controls mode-toggle">
    <label for="theme-mode">Dark mode</label>
    <input
      id="theme-mode"
      type="checkbox"
      role="switch"
      [checked]="isDark"
      (change)="onModeToggle($event)"
    />
  </div>
  <div class="theme-controls">
    <button type="button" class="reset-theme" (click)="resetTheme()">Reset to default</button>
  </div>
</section>
